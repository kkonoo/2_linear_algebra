project:
  type: website
  execute-dir: project
  # output-dir: _site

website:
  title: "선형대수"
  description: "기하학적 직관으로 읽는 선형대수 — 벡터에서 SVD까지"
  favicon: images/logo.ico
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/kkonoo/2_linear_algebra

  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: index.qmd

      - section: "Part I. 벡터와 행렬"
        contents:
          - chapters/01_vector.qmd
          - chapters/02_linear_transformation.qmd
          - chapters/03_inner_product.qmd

      - section: "Part II. 공간의 구조"
        contents:
          - chapters/04_subspaces.qmd
          - chapters/05_change_of_basis.qmd
          - chapters/06_determinant.qmd

      - section: "Part III. 연립방정식 풀기"
        contents:
          - chapters/07_gauss_elimination.qmd
          - chapters/08_lu_cholesky.qmd

      - section: "Part IV. 최적해"
        contents:
          - chapters/09_least_squares.qmd
          - chapters/10_pseudo_inverse.qmd

      - section: "Part V. 분해"
        contents:
          - chapters/11_eigen.qmd
          - chapters/12_evd.qmd
          - chapters/13_pca.qmd
          - chapters/14_qr.qmd
          - chapters/15_svd.qmd

      - section: "Part VI. 더 나아가기"
        contents:
          - chapters/16_ica_nmf.qmd
          - chapters/17_matrix_calculus.qmd
          - chapters/18_fourier.qmd

      - section: "부록"
        contents:
          - appendix/a_numerical.qmd
          - appendix/b_affine.qmd
          - appendix/c_cheatsheet.qmd

  page-footer:
    left: "Copyright 2026, Eunji"


format:
  html:
    theme:
      light: cosmo
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false
    code-copy: true
    highlight-style: github

    number-sections: false
    smooth-scroll: true

    html-math-method: mathjax

    # AI 채팅 위젯 전역 설정
    include-after-body: assets/ai-chat-init.html

  revealjs:
    css: assets/revealjs.css    # 슬라이드용


execute:
  freeze: auto          # 코드 실행 결과 캐시 (빠른 빌드)
  echo: true
  eval: false
  warning: false
  message: false
