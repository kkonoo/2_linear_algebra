<!-- AI Chat Widget 초기화 -->
<!-- _quarto.yml의 include-after-body에 등록되어 모든 페이지에 자동 삽입됩니다 -->
<script>
  // ★ Cloudflare Worker 배포 후 URL로 교체하세요
  const WORKER_URL = "https://falling-wave-447f.eh0129s.workers.dev/";

  // 각 .qmd 파일의 YAML에서 ai-context를 읽어옵니다
  // (없으면 빈 문자열 → 기본 안내 메시지)
  const metaContext = document.querySelector('meta[name="ai-context"]');
  const metaTitle   = document.querySelector('meta[name="ai-title"]') || { content: document.title };

  window.AI_CHAT_CONFIG = {
    workerUrl:      WORKER_URL,
    chapterContext: metaContext ? metaContext.content : "",
    chapterTitle:   metaTitle  ? metaTitle.content   : document.title,
  };

  // ai-chat.js 는 assets/ 에 둡니다.
  // ⚠️ _extensions/ 처럼 밑줄로 시작하는 폴더는 Quarto가 _site/ 로 복사하지 않아서
  //    빌드된 사이트에서 404가 납니다. assets/ 는 그대로 복사됩니다.
  // 경로는 quarto:offset 메타로 사이트 루트를 찾아 붙입니다
  // (고정 "../assets/..." 로 쓰면 루트의 index.html 에서 깨집니다).
  (function () {
    var offsetMeta = document.querySelector('meta[name="quarto:offset"]');
    var root = offsetMeta ? offsetMeta.content : "./";
    if (root && !root.endsWith("/")) root += "/";
    var s = document.createElement("script");
    s.src = root + "assets/ai-chat.js";
    s.defer = true;
    document.body.appendChild(s);
  })();
</script>
